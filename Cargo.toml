[package]
name = "cl-async"
version = "3.5.3"
edition = "2024"

[features]
default = ["log-warn", "log-error"]
log-info = ["log", "cl-log"]
log-warn = ["log", "cl-log"]
log-error = ["log", "cl-log"]

[dependencies]
crossbeam-deque = "0.8.7"
crossbeam-queue = "0.3.13"
crossbeam-channel = "0.5.16"
crossbeam =  "0.8.4"
num_cpus = "1.17.0"
once_cell = "1.20.3"
log = { version = "0.4.33", features = ["std"], optional = true }
thiserror = "2.0.20"
cl-log = { git = "https://github.com/Liyara/cl-log.git", optional = true }
libc = "0.2.189"
bitflags = "2.13.1"
rustc-hash = "2.1.3"
parking_lot = "0.12.5"
dashmap = "6.2.1"
io-uring = "0.7.14"
io_uring_buf_ring = "0.2"
enum_dispatch = "0.3.13"
async-channel = "2.5.0"
async-broadcast = "0.7.2"
futures = "0.3.34"
sysctl = "0.7.1"
bytes = "1.12.1"

[[bin]]
name = "cl-async"
path = "src/bin/main.rs"